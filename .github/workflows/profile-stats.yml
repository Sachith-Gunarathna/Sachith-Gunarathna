name: Refresh Bento OS Telemetry

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-profile.mjs'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Exact Bento OS Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: Sachith-Gunarathna
          BENTO_THEME: SIGNAL_ORANGE
        run: node scripts/update-profile.mjs
      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/02-telemetry-row.svg assets/04-contribution-velocity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Bento OS telemetry"
            git push
          fi
